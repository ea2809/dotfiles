set-option -g default-shell /bin/zsh

# Use one guarded copy path for mouse selections and keyboard copies (tmux 3.2+).
# Disable OSC 52 here so it cannot bypass the empty-selection guard.
set -s set-clipboard off
set -s copy-command 'sh ~/dotfiles/tmux/copy-if-not-empty.sh'

bind-key C-c run-shell 'tmux save-buffer - | sh ~/dotfiles/tmux/copy-if-not-empty.sh'
bind-key C-v run-shell 'pbpaste | tmux load-buffer - \; paste-buffer -d'
